<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--ink:#121212;--gold:#F4B942;--teal:#2B6E6A;--teal2:#2F7773;--red:#FF5A4A;--green:#8EE07A;--blue:#7FB2FF}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden}
canvas{position:absolute;inset:0}
#caps{position:absolute;left:40px;right:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;pointer-events:none}
.w{font-family:"Archivo Black",sans-serif;font-size:66px;line-height:1.08;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;letter-spacing:.5px;text-shadow:6px 6px 0 var(--ink);padding:2px 10px;position:relative}
.w.on{color:var(--ink);-webkit-text-stroke:0;text-shadow:none;background:var(--gold);border:6px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:0 12px}
.w.punch.on{background:var(--red);color:#fff}
#caps.dark{background:rgba(13,13,13,.82);padding:18px 10px 24px;border-top:6px solid var(--gold);border-bottom:6px solid var(--gold);left:0;right:0}
#bug{position:absolute;left:34px;top:34px;display:flex;align-items:center;gap:12px;font-family:Silkscreen;font-weight:700;font-size:26px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
#bug i{width:24px;height:24px;background:var(--gold);border:5px solid var(--ink);transform:rotate(45deg);box-shadow:3px 3px 0 var(--ink)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head>
<body><div id="stage"><canvas id="cv" width="1080" height="1350"></canvas><div id="bug"><i></i>AGENTDESK</div><div id="caps"></div><div id="flash"></div></div>
<script>
/* Every frame is drawn as a pure function of time t (seconds), so the render is exact and repeatable. */
const W=1080,H=1350,cv=document.getElementById('cv'),x=cv.getContext('2d');
let P=null,FT=[],imgCache=new Map();
const INK='#121212',GOLD='#F4B942',TEAL='#2B6E6A',TEAL2='#2F7773',RED='#FF5A4A',GREEN='#8EE07A',BLUE='#7FB2FF',WHITE='#fff';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const easeOut=u=>1-Math.pow(1-u,3);
const back=u=>{const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};
const rnd=s=>{const v=Math.sin(s*12.9898)*43758.5453;return v-Math.floor(v);};

/* ---------- desk footage ---------- */
// desk-space rectangles (the recording is 1440x900 CSS px, 2880x1800 pixels)
const R={full:[0,0,1440,900],ed:[24,58,775,512],web:[592,78,688,494],term:[420,500,716,322],test:[462,140,631,476],
  img:[246,68,688,566],git:[650,112,544,386],net:[420,204,660,330],files:[88,104,458,386],perm:[492,280,456,232],help:[30,554,386,268],
  menu:[980,0,460,36]};
function frameAt(ft){ // nearest recorded frame for footage time ft
  let lo=0,hi=FT.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(FT[m]<=ft)lo=m;else hi=m-1;}return lo;}
async function img(i){const k='f'+i;if(imgCache.has(k))return imgCache.get(k);
  const im=new Image();im.src='work/desk-frames/'+String(i).padStart(5,'0')+'.jpg';await im.decode();
  imgCache.set(k,im);if(imgCache.size>40){imgCache.delete(imgCache.keys().next().value);}return im;}
function rectLerp(a,b,u){return a.map((v,i)=>lerp(v,b[i],u));}
function pad(r,p){return [r[0]-p,r[1]-p,r[2]+2*p,r[3]+2*p];}
// draws the desk: blurred full desk behind, the camera rectangle in front (contained in the box)
function drawDesk(im,cam,{box=[40,190,1000,880],full=false,blurBg=true,dim=.45,round=22,shakeX=0,shakeY=0,zoomPunch=1}={}){
  const S=2; // pixels per desk px
  if(blurBg){x.save();x.filter='blur(34px) saturate(1.2)';const sc=Math.max(W/1440,H/900)*1.15;const w=1440*sc,h=900*sc;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);x.restore();
    x.fillStyle=`rgba(10,24,24,${dim})`;x.fillRect(0,0,W,H);}
  let [cx,cy,cw,ch]=cam;cx=clamp(cx,0,1440-10);cy=clamp(cy,0,900-10);cw=Math.min(cw,1440-cx);ch=Math.min(ch,900-cy);
  let [bx,by,bw,bh]=box;if(full){bx=0;by=0;bw=W;bh=H;}
  const sc=Math.min(bw/cw,bh/ch)*zoomPunch;const dw=cw*sc,dh=ch*sc;const dx=bx+(bw-dw)/2+shakeX,dy=by+(bh-dh)/2+shakeY;
  x.save();
  if(!full){x.fillStyle=INK;roundRect(dx+12,dy+12,dw,dh,round);x.fill();roundRect(dx-6,dy-6,dw+12,dh+12,round+4);x.fill();roundRect(dx,dy,dw,dh,round);x.clip();}
  x.imageSmoothingQuality='high';x.drawImage(im,cx*S,cy*S,cw*S,ch*S,dx,dy,dw,dh);
  x.restore();
  return [dx,dy,dw,dh];
}
function roundRect(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);}

/* ---------- drawn scenes ---------- */
const TERM_LINES=(()=>{const L=[];const files=['src/auth/session.ts','src/api/billing.ts','lib/cache.go','app/models/user.rb','src/ui/Table.tsx','server/routes.py','src/hooks/useCart.ts','db/migrations/0042.sql'];
  for(let i=0;i<260;i++){const f=files[i%files.length];const k=i%7;
    L.push(k===0?['#E8E8E8','● Read('+f+')']:k===1?['#8a8a8a','  ⎿ Read '+(40+((i*37)%400))+' lines']:k===2?['#E8E8E8','● Update('+f+')']:k===3?['#8EE07A','  + '+['const token = await refresh(user)','if (!cart.items.length) return null','retry(3, () => fetchInvoice(id))','cache.set(key, value, ttl)'][i%4]]:
      k===4?['#FF8A8A','  - '+['return session.token','// TODO: handle expiry','items.forEach(render)','cache.put(key, value)'][i%4]]:k===5?['#E8E8E8','● Bash(npm test -- '+f.split('/').pop().split('.')[0]+')']:['#8a8a8a','  ⎿ '+(i%3?'PASS':'… +'+(12+i%40)+' lines (ctrl+o to expand)')]);}
  return L;})();
function drawTerminal(scroll,{glitch=0,blur=0,zoom=1}={}){
  x.save();x.fillStyle='#0d0d0d';x.fillRect(0,0,W,H);
  x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);
  if(blur)x.filter=`blur(${blur}px)`;
  x.font='600 30px "IBM Plex Mono"';x.textBaseline='top';
  const lh=44,first=Math.floor(scroll/lh);
  for(let r=-1;r<H/lh+2;r++){const li=TERM_LINES[(first+r+TERM_LINES.length*10)%TERM_LINES.length];const y=r*lh-(scroll%lh)+40;
    let ox=0;if(glitch&&rnd(first+r+Math.floor(glitch*997))<.18)ox=(rnd(r+glitch*13)-.5)*90*glitch;
    x.fillStyle=li[0];x.fillText(li[1],44+ox,y);}
  x.restore();
  if(glitch){ // colour split and torn slices
    const g=x.getImageData(0,0,W,H);x.globalCompositeOperation='lighter';x.globalAlpha=.5*glitch;
    x.drawImage(cv,14*glitch,0);x.drawImage(cv,-14*glitch,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
    for(let s=0;s<6;s++){const sy=Math.floor(rnd(s+glitch*31)*H),sh=20+rnd(s*7+glitch)*60,dx=(rnd(s*3+glitch*5)-.5)*120*glitch;x.putImageData(g,dx,0,0,sy,W,sh);}
    x.fillStyle=`rgba(255,90,74,${.12*glitch})`;x.fillRect(0,0,W,H);}
  // scanlines
  x.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=4)x.fillRect(0,y,W,1);
}
function checker(alpha=1,off=0){x.fillStyle=TEAL;x.fillRect(0,0,W,H);x.fillStyle=TEAL2;const s=54;for(let i=-1;i<W/s+1;i++)for(let j=-1;j<H/s+1;j++)if((i+j)%2===0)x.fillRect(i*s+(off%(2*s)),j*s,s,s);
  const g=x.createRadialGradient(W/2,H/2,200,W/2,H/2,900);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${.45*alpha})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function diamond(cx,cy,s,rot=0){x.save();x.translate(cx,cy);x.rotate(Math.PI/4+rot);x.fillStyle=INK;x.fillRect(-s/2-14+10,-s/2-14+10,s+28,s+28);x.fillRect(-s/2-14,-s/2-14,s+28,s+28);x.fillStyle=GOLD;x.fillRect(-s/2,-s/2,s,s);x.restore();}
function chunky(text,cx,cy,size,{fill=WHITE,font='"Archivo Black"',stroke=14,shadow=8,align='center',alpha=1}={}){
  x.save();x.globalAlpha=alpha;x.font=`${size}px ${font}`;x.textAlign=align;x.textBaseline='middle';x.lineJoin='round';
  x.fillStyle=INK;x.lineWidth=stroke;x.strokeStyle=INK;x.strokeText(text,cx+shadow,cy+shadow);x.fillText(text,cx+shadow,cy+shadow);
  x.strokeText(text,cx,cy);x.fillStyle=fill;x.fillText(text,cx,cy);x.restore();}
function chip(text,cx,cy,{bg=GOLD,fg=INK,size=44,scale=1,rot=0,font='Silkscreen'}={}){
  x.save();x.translate(cx,cy);x.rotate(rot);x.scale(scale,scale);x.font=`700 ${size}px ${font}`;const w=x.measureText(text).width+56,h=size+40;
  x.fillStyle=INK;x.fillRect(-w/2+10,-h/2+10,w,h);x.fillRect(-w/2-6,-h/2-6,w+12,h+12);x.fillStyle=bg;x.fillRect(-w/2,-h/2,w,h);
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(text,0,3);x.restore();}
function retroWin(bx,by,bw,bh,title,bar=BLUE){x.fillStyle=INK;x.fillRect(bx+16,by+16,bw,bh);x.fillRect(bx-6,by-6,bw+12,bh+12);x.fillStyle='#fff';x.fillRect(bx,by,bw,bh);
  x.fillStyle=bar;x.fillRect(bx,by,bw,62);x.fillStyle=INK;x.fillRect(bx,by+62,bw,6);
  x.font='700 26px Silkscreen';x.textBaseline='middle';x.textAlign='left';x.fillText(title,bx+70,by+32);x.strokeStyle=INK;x.lineWidth=5;x.strokeRect(bx+22,by+16,30,30);}

/* ---------- shots ---------- */
// word time helper: time (shot-local) at which word k of this line starts
const wt=(L,k)=>L.words[Math.min(k,L.words.length-1)].t0-L.start;
const findWord=(L,re)=>{const i=L.words.findIndex(w=>re.test(w.w));return i<0?null:L.words[i].t0-L.start;};
function deskShot(cam0,cam1,ft0,rate=1,opts={}){return async(u,d,L)=>{const im=await img(frameAt(ft0+u*rate));
  const k=ease(clamp(u/d));const punch=1+.07*Math.max(0,1-u/.22);
  return drawDesk(im,rectLerp(cam0,cam1,k),{...opts,zoomPunch:punch*(opts.zoomPunch||1)});};}
const SHOTS={
  'terminal':async(u,d)=>{drawTerminal(u*520,{zoom:1+u*.02});},
  'terminal-glitch':async(u,d,L)=>{const g=clamp(1-Math.abs(u-.15)/.5)*.9+(u>d-.25?clamp((u-(d-.25))/.25):0);drawTerminal(9000+u*60,{glitch:g,zoom:1.08});},
  'terminal-blur':async(u,d)=>{const k=clamp(u/d);drawTerminal(12000+Math.pow(u,2.2)*4000,{blur:k*10,zoom:1+k*.25});x.fillStyle=`rgba(0,0,0,${k*.5})`;x.fillRect(0,0,W,H);},
  'logo':async(u,d,L)=>{checker(1,u*40);const a=clamp(u/.42);const s=lerp(620,250,back(a));diamond(W/2,H/2-150,s,(1-easeOut(a))*-1.2);
    const b=clamp((u-.25)/.35);if(b>0)chunky('AgentDesk',W/2,H/2+170,lerp(40,150,back(b)),{fill:WHITE,stroke:22,shadow:12});
    const c=clamp((u-.6)/.3);if(c>0)chip('WATCH YOUR AI CODE',W/2,H/2+330,{size:34,scale:back(c),bg:GOLD});},
  'desk-wide':async(u,d,L)=>{const im=await img(frameAt(8.3+u*1.15));const k=ease(clamp(u/d));checker(.7);
    drawDesk(im,R.full,{blurBg:false,box:[lerp(70,30,k),lerp(300,250,k),lerp(940,1020,k),lerp(600,700,k)],round:18,zoomPunch:1+.05*Math.max(0,1-u/.25)});},
  'zoom-editor':deskShot(pad(R.ed,30),pad(R.ed,-40),10.0,0.9),
  'zoom-diff':async(u,d,L)=>{const im=await img(frameAt(23.2+u*1.25));const k=ease(clamp(u/d));
    return drawDesk(im,rectLerp(pad(R.ed,0),[60,90,560,300],k),{zoomPunch:1+.07*Math.max(0,1-u/.22)});},
  'zoom-tests':async(u,d,L)=>{const failAt=findWord(L,/^fail\.?$/i)??d*.6;// footage: RUNNING from 33.35 s, FAILED shows at 33.95 s; FAILED lands on the word "fail"
    const ft=u<failAt?33.35+u/failAt*0.6:33.95+(u-failAt);const im=await img(frameAt(ft));
    const hit=u-failAt;const sh=hit>0&&hit<.45?Math.sin(hit*70)*(1-hit/.45)*26:0;
    drawDesk(im,rectLerp(pad(R.test,40),pad(R.test,-10),ease(clamp(u/d))),{shakeX:sh,zoomPunch:1+.07*Math.max(0,1-u/.22)});
    if(hit>0&&hit<.25){x.fillStyle=`rgba(255,90,74,${.35*(1-hit/.25)})`;x.fillRect(0,0,W,H);}},
  'zoom-permission':deskShot(pad(R.perm,120),pad(R.perm,20),29.7,1),
  'zoom-image':deskShot(pad(R.img,10),[600,170,330,320],59.0,1.0),
  'montage':async(u,d,L)=>{const a=findWord(L,/^GitHub/i)??d*.25,b=findWord(L,/^Helper/i)??d*.5,c=findWord(L,/^All/i)??d*.75;
    let im,cam,local;
    if(u<a){local=u;im=await img(frameAt(67.3+u));cam=rectLerp(pad(R.git,10),pad(R.git,-30),ease(clamp(u/a)));}
    else if(u<b){local=u-a;im=await img(frameAt(71.2+local*1.4));cam=rectLerp(pad(R.net,10),pad(R.net,-20),ease(clamp(local/(b-a))));}
    else if(u<c){local=u-b;im=await img(frameAt(12.6+local*1.2));cam=rectLerp(pad(R.help,40),pad(R.help,0),ease(clamp(local/(c-b))));}
    else{local=u-c;im=await img(frameAt(78.5));cam=rectLerp(pad(R.help,200),R.full,easeOut(clamp(local/.8)));}
    const whip=Math.max(0,1-local/.16);x.save();if(whip>0&&u>.1){x.filter=`blur(${whip*14}px)`;}
    drawDesk(im,cam,{shakeX:whip>0&&u>.1?whip*-80:0,zoomPunch:1+.06*Math.max(0,1-local/.2)});x.restore();},
  'agents':async(u,d,L)=>{const im=await img(frameAt(38));drawDesk(im,R.full,{box:[0,0,0,0],dim:.62});x.fillStyle='rgba(0,0,0,0)';
    const names=[['CLAUDE CODE',/^Claude/i,GOLD],['CODEX',/^Codex/i,BLUE],['GEMINI CLI',/^Gemini/i,GREEN]];
    names.forEach(([n,re,bg],i)=>{const t0=findWord(L,re)??(.3+i*.5);const k=clamp((u-t0+.05)/.3);if(k<=0)return;chip(n,W/2,420+i*190,{size:58,scale:back(k),bg,rot:(i-1)*.04});});},
  'tokens':async(u,d,L)=>{checker(.9,u*30);const t0=findWord(L,/^0$/)??.6;const k=clamp((u-t0+.05)/.3);
    if(k>0){const s=back(k);x.save();x.translate(W/2,430);x.rotate(-.06);x.scale(s,s);chunky('0',0,-40,300,{fill:GOLD,stroke:26,shadow:16});chunky('TOKENS',0,170,110,{fill:WHITE,stroke:20,shadow:10});x.restore();}
    const l=findWord(L,/^logs$/i)??d*.6;const m=clamp((u-l+.1)/.35);
    if(m>0){x.save();x.globalAlpha=m;retroWin(150,740,780,150,'~/.claude/projects',GOLD);x.font='600 34px "IBM Plex Mono"';x.fillStyle=INK;x.textAlign='left';x.fillText('session.jsonl  →  your desk',190,840);x.restore();}},
  'command':async(u,d,L)=>{checker(.9,u*30);retroWin(90,330,900,380,'TERMINAL',INK);x.fillStyle='#0d0d0d';x.fillRect(90,398,900,312);
    const cmd='npx @iammcoding/agentdesk';const t1=findWord(L,/^One/i)??d*.5;const typed=Math.floor(clamp(u/(t1+.35))*cmd.length);
    x.font='600 44px "IBM Plex Mono"';x.textAlign='left';x.textBaseline='middle';x.fillStyle=GREEN;x.fillText('$',130,470);x.fillStyle='#E8E8E8';x.fillText(cmd.slice(0,typed)+(Math.floor(u*3)%2?'█':' '),175,470);
    if(u>t1+.5){x.fillStyle='#5FD3E8';x.font='500 30px "IBM Plex Mono"';x.fillText('AgentDesk is running at',130,560);x.fillText('http://localhost:4747',130,605);}
    const tags=[['FREE',/^Free/i,GOLD,-.08],['OPEN SOURCE',/^Open/i,GREEN,.05],['ONE COMMAND',/^One/i,BLUE,-.04]];
    tags.forEach(([n,re,bg,rot],i)=>{const t0=findWord(L,re)??i*.4;const k=clamp((u-t0+.05)/.28);if(k>0)chip(n,[290,760,540][i],[230,230,820][i],{size:38,scale:back(k),bg,rot});});},
  'end':async(u,d,L)=>{checker(1,u*30);const k=clamp(u/.4);
    chunky('Do you read',W/2,300,96,{alpha:k});chunky('every line',W/2,410,96,{alpha:k,fill:GOLD});chunky('your AI writes?',W/2,520,96,{alpha:k});
    const b=clamp((u-.5)/.3);if(b>0){chip('YES',330,740,{size:72,bg:GREEN,scale:back(b),rot:-.05});chip('NO',750,740,{size:72,bg:RED,fg:WHITE,scale:back(clamp((u-.65)/.3)),rot:.05});}
    // the agent's pointer hesitating between the two
    if(u>1){const px=540+Math.sin((u-1)*2.4)*190,py=800;x.save();x.translate(px,py);x.fillStyle=INK;x.beginPath();x.moveTo(8,8);x.lineTo(8,98);x.lineTo(32,76);x.lineTo(50,112);x.lineTo(68,104);x.lineTo(50,68);x.lineTo(84,68);x.closePath();x.fill();
      x.fillStyle=WHITE;x.beginPath();x.moveTo(0,0);x.lineTo(0,88);x.lineTo(24,66);x.lineTo(42,102);x.lineTo(58,94);x.lineTo(40,58);x.lineTo(74,58);x.closePath();x.fill();x.lineWidth=7;x.strokeStyle=INK;x.stroke();x.restore();}
    const c=clamp((u-1.2)/.4);if(c>0){chunky('Tell me in the comments',W/2,960,52,{alpha:c,fill:WHITE,stroke:12,shadow:6});
      x.save();x.globalAlpha=c;chip('npx @iammcoding/agentdesk',W/2,1110,{size:32,bg:WHITE,font:'"IBM Plex Mono"'});x.restore();}},
};

/* ---------- captions ---------- */
function captions(t,L){const el=document.getElementById('caps');
  if(!L||L.shot==='end'){el.innerHTML='';return;}
  const ws=L.words;let cur=ws.findIndex(w=>t>=w.t0&&t<w.t1+.12);if(cur<0){cur=ws.findIndex(w=>t<w.t0)-1;if(cur<-1)cur=ws.length-1;}
  // groups of up to 3 words, breaking after punctuation
  const groups=[];let g=[];ws.forEach((w,i)=>{g.push(i);if(g.length===3||/[.,?!]$/.test(w.w)){groups.push(g);g=[];}});if(g.length)groups.push(g);
  const gi=Math.max(0,groups.findIndex(gr=>gr.includes(Math.max(cur,0))));const gr=groups[gi]||[];
  if(t<ws[0].t0-.05){el.innerHTML='';return;}
  const since=t-ws[gr[0]].t0;const pop=since<.12?.86+since/.12*.14:1;
  el.style.transform=`scale(${pop})`;el.classList.toggle('dark',/^terminal/.test(L.shot));
  el.innerHTML=gr.map(i=>`<span class="w ${i===cur?'on':''} ${L.punch&&L.punch.includes(ws[i].w)?'punch':''}">${ws[i].w.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`).join('');
  const lowShots={'logo':1210,'tokens':1180,'command':1190,'agents':1120,'desk-wide':1110};
  const y=lowShots[L.shot]??1130;el.style.top=y-el.offsetHeight/2+'px';el.style.transformOrigin='50% 50%';
}

/* ---------- one frame ---------- */
window.renderAt=async t=>{
  const L=P.lines.find(l=>t>=l.start&&t<l.end)||P.lines[P.lines.length-1];
  const u=t-L.start,d=L.end-L.start;
  x.save();x.clearRect(0,0,W,H);
  await (SHOTS[L.shot]||SHOTS.terminal)(u,d,L);
  x.restore();
  // a flash on the logo slam and on the first desk shot
  const fl=document.getElementById('flash');fl.style.opacity=(L.shot==='logo'||L.shot==='desk-wide')?Math.max(0,.85-u*4.5):0;
  document.getElementById('bug').style.display=/^(zoom|desk|montage|agents)/.test(L.shot)?'flex':'none';
  captions(t,L);
};
window.setup=async(plan,ft)=>{P=plan;FT=ft;await document.fonts.ready;
